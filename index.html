<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Search Console 所有権確認 -->
  <meta name="google-site-verification" content="dn0zliftoj2USM8wlk3p_PAun--H8mqlvw9Ux0usvXc" />

  <!-- Bing Webmaster Tools 所有権確認（GSC からインポートする場合は不要）。
       取得したコードに置き換えて有効化する:
  <meta name="msvalidate.01" content="ここにBingの検証コード" /> -->

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S2NPFRCHQV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-S2NPFRCHQV');
  </script>

  <!-- 基本SEO -->
  <title>商品横断検索 | Amazon・楽天・メルカリを一括比較 - item-search.jp</title>
  <meta name="description"
    content="Amazon・楽天市場・Yahoo!オークション・メルカリ・ヨドバシ・ビックカメラなど複数のオンラインショップを横断して一括検索。ほしい商品の価格をサイトをまたいで比較し、最安値を見つけられる通販横断検索サービスです。" />
  <meta name="keywords"
    content="横断検索,通販,比較,価格比較,最安値,商品検索,一括検索,Amazon,楽天,楽天市場,メルカリ,ヤフオク,Yahoo!オークション,ヨドバシ,ビックカメラ,オンラインショップ,ショッピング,item-search" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="author" content="item-search.jp" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="canonical" href="https://item-search.jp/" />

  <!-- サイトロゴ / ファビコン -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph (Facebook / LINE など) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="item-search.jp" />
  <meta property="og:title" content="商品横断検索 | 複数の通販サイトをまとめて比較 - item-search.jp" />
  <meta property="og:description" content="Amazon・楽天・メルカリ・ヤフオク・ヨドバシ・ビックカメラを横断して一括検索。サイトをまたいで価格を比較し、最安値を見つけられます。" />
  <meta property="og:url" content="https://item-search.jp/" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:image" content="https://item-search.jp/ogp.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="商品横断検索 | 複数の通販サイトをまとめて比較 - item-search.jp" />
  <meta name="twitter:description" content="Amazon・楽天・メルカリ・ヤフオク・ヨドバシ・ビックカメラを横断して一括検索。サイトをまたいで価格を比較し、最安値を見つけられます。" />
  <meta name="twitter:image" content="https://item-search.jp/ogp.jpg" />

  <!-- 構造化データ: サイト + サイト内検索 -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "item-search.jp 商品横断検索",
        "alternateName": "item-search",
        "url": "https://item-search.jp/",
        "description": "Amazon・楽天・メルカリ・ヤフオク・ヨドバシ・ビックカメラなど複数のオンラインショップを横断して一括検索し、価格を比較できる通販横断検索サービス。",
        "inLanguage": "ja",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://item-search.jp/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <!-- 本文は scripts/prerender.mjs が #root にページ固有の静的 HTML を焼き込む（クローラー向け）。
       noscript はページをまたいで同じ内容になるため、重複コンテンツにならない短い案内だけにする。 -->
  <noscript>
    <p>検索機能のご利用には JavaScript を有効にしてください。</p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
