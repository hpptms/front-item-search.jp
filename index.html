  <!-- 基本SEO -->
  <title>item-search</title>

    content="Amazon・楽天市場・Yahoo!オークション・メルカリ・ヨドバシ・ビックカメラなど複数のオンラインショップを横断して一括検索。ほしい商品の価格をサイトをまたいで比較し、最安値を見つけられる通販横断検索サービスです。" />

  <meta name="author" content="item-search.jp" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="canonical" href="https://item-search.jp/" />

  <meta property="og:type" content="website" />

  <meta name="twitter:image" content="https://item-search.jp/ogp.png" />

  <!-- 構造化データ: サイト + サイト内検索 -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "item-search.jp 商品横断検索",
        "alternateName": "item-search",
        "url": "https://item-search.jp/",
        "description": "Amazon・楽天・メルカリ・ヤフオク・ヨドバシ・ビックカメラなど複数のオンラインショップを横断して一括検索し、価格を比較できる通販横断検索サービス。",
        "inLanguage": "ja",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://item-search.jp/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <!-- クローラー / JS無効環境向けの説明。実際の検索UIはJSで描画されます。 -->
  <noscript>
    <h1>商品横断検索 - 複数のオンラインショップをまとめて検索</h1>
    <p>
      item-search.jp は Amazon・楽天市場・Yahoo!オークション・メルカリ・ヨドバシ・ビックカメラなど、
      複数のオンラインショップを横断して商品を一括検索できるサービスです。
      サイトをまたいで価格を比較し、ほしい商品の最安値を見つけられます。
      ご利用には JavaScript を有効にしてください。
    </p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
